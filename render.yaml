# Render Blueprint: Showwriter Studio as one web service (API + built frontend).
# Scripts live in each visitor's browser, so no disk is needed. Deploy: Render -> New -> Blueprint.
services:
  - type: web
    name: showwriter-studio
    runtime: docker
    dockerContext: showrunner-studio
    dockerfilePath: showrunner-studio/Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: PROJEC_GOOGLE_API_KEY
        sync: false
